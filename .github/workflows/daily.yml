name: 每日更新并发布

on:
  schedule:
    # 每天 08:00（北京时间 UTC+8）自动采集
    - cron: "0 0 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集并生成 data/news.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -u scripts/collect.py

      - name: 提交当天数据
        run: |
          git config user.name "battery-hot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.js data/history data/daily
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: 每日更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
