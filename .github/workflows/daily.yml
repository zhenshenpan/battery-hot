name: 每日更新并发布

on:
  schedule:
    # 每天 08:00（北京时间 UTC+8）自动采集
    - cron: "0 0 * * *"
  # 代码有改动时立即跑一次，省去手动触发
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集并生成 data/news.js
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -u scripts/collect.py

      - name: 提交当天数据
        run: |
          git config user.name "battery-hot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.js data/history data/daily 2>/dev/null || git add data
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: 每日更新 $(date -u +%Y-%m-%d)"
            # 远端可能已被别的一次运行推进，rebase 后重试，最多 4 次
            ok=0
            for i in 1 2 3 4; do
              if git push origin HEAD:main; then ok=1; break; fi
              git pull --rebase --autostash origin main || true
              sleep $((i * 3))
            done
            if [ "$ok" != "1" ]; then
              echo "::warning::数据提交未成功，但页面仍会按本次生成结果发布"
            fi
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
